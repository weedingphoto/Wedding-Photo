<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fffaf8">
<title>THAN ZAW HTUT & EI EI PHYO • Wedding Memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Montserrat:wght@300;400;500&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#4b3b3b; --muted:#8b7777; --rose:#c98793; --rose2:#efd4d8;
    --cream:#fffaf8; --card:#ffffff; --line:#eadedf; --gold:#c9a86a;
    --gold2:#e8d5a8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--cream);color:var(--ink);
    font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden}
  button{font:inherit;color:inherit}

  .page{max-width:720px;margin:auto;padding:22px 16px 60px;position:relative;z-index:2}

  .hero{text-align:center;padding:30px 8px 14px;position:relative}
  .eyebrow{
    font-family:'Montserrat',Arial,sans-serif;letter-spacing:5px;
    text-transform:uppercase;font-size:10px;color:var(--rose);font-weight:500;
    opacity:0;animation:fadeUp .9s .1s ease forwards;
  }
  .ornament{
    display:flex;align-items:center;justify-content:center;
    gap:10px;margin:16px auto;max-width:220px;
    opacity:0;animation:fadeUp .9s .25s ease forwards;
  }
  .ornament::before,.ornament::after{
    content:'';flex:1;height:1px;
    background:linear-gradient(90deg,transparent,var(--rose2),transparent);
  }
  .ornament span{
    color:var(--gold);font-size:14px;
    animation:sparkle 3s ease-in-out infinite;
  }
  @keyframes sparkle{
    0%,100%{opacity:.7;transform:scale(1) rotate(0deg)}
    50%{opacity:1;transform:scale(1.15) rotate(15deg)}
  }
  h1{
    font-weight:300;font-size:36px;line-height:1.15;margin:14px 0 8px;
    letter-spacing:.5px;position:relative;
    opacity:0;animation:fadeUp 1s .4s ease forwards;
  }
  h1 .amp{
    display:block;font-style:italic;font-size:22px;color:var(--rose);
    margin:6px 0;font-weight:300;
  }
  h1::before,h1::after{
    content:'✦';
    position:absolute;font-size:10px;color:var(--gold2);
    opacity:0;animation:twinkle 2.5s ease-in-out infinite;
  }
  h1::before{top:6px;left:6%;animation-delay:.2s}
  h1::after{bottom:8px;right:6%;animation-delay:1.2s}
  @keyframes twinkle{
    0%,100%{opacity:0;transform:scale(.5)}
    50%{opacity:.9;transform:scale(1.3)}
  }
  .date{
    font-family:'Montserrat',Arial,sans-serif;color:var(--muted);
    font-size:11px;letter-spacing:3px;font-weight:400;margin-top:10px;
    opacity:0;animation:fadeUp 1s .7s ease forwards;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }
  .countdown{
    display:flex;justify-content:center;gap:14px;margin:22px 0 4px;
    font-family:'Montserrat',Arial,sans-serif;
    opacity:0;animation:fadeUp 1s 1s ease forwards;
  }
  .cd-item{text-align:center;min-width:52px;position:relative}
  .cd-num{
    font-size:20px;font-weight:500;color:var(--ink);letter-spacing:1px;
    transition:color .4s;
  }
  .cd-item.tick .cd-num{color:var(--rose);animation:tickPop .4s ease}
  @keyframes tickPop{
    0%{transform:scale(1)}
    50%{transform:scale(1.18)}
    100%{transform:scale(1)}
  }
  .cd-lbl{
    font-size:8px;letter-spacing:2px;color:var(--muted);
    text-transform:uppercase;margin-top:2px;
  }
  .cd-sep{
    color:var(--rose2);font-size:20px;align-self:center;margin-top:-8px;
    animation:blink 2s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}

  .calendar-wrap{
    text-align:center;margin:26px auto 6px;padding:0 8px;
    opacity:0;animation:fadeUp 1s 1.2s ease forwards;
  }
  .cal-btn{
    display:inline-flex;align-items:center;gap:10px;
    background:#fff;color:var(--ink);border:1px solid var(--rose2);
    border-radius:999px;padding:13px 26px;
    font-family:'Montserrat',Arial,sans-serif;font-size:12px;
    font-weight:500;letter-spacing:1.5px;text-transform:uppercase;
    cursor:pointer;text-decoration:none;
    transition:all .3s cubic-bezier(.2,0,.2,1);
    box-shadow:0 6px 18px -10px rgba(180,120,140,.4);
  }
  .cal-btn:hover{
    background:var(--rose);color:#fff;border-color:var(--rose);
    transform:translateY(-2px);
  }
  .cal-btn:active{transform:translateY(0) scale(.97)}

  .cta-wrap{
    text-align:center;margin:26px auto 24px;padding:0 8px;
    opacity:0;animation:fadeUp 1s 1.4s ease forwards;
  }
  .cta{
    display:inline-flex;align-items:center;gap:12px;
    background:linear-gradient(135deg,#d68b99,#c98793);
    color:#fff;border:0;border-radius:999px;
    padding:18px 42px;font-family:'Montserrat',Arial,sans-serif;
    font-size:14px;font-weight:500;letter-spacing:2.5px;
    text-transform:uppercase;cursor:pointer;
    box-shadow:0 14px 30px -12px rgba(180,90,110,.6);
    transition:all .3s cubic-bezier(.2,0,.2,1);
    animation:glow 2.6s ease-in-out infinite;
  }
  .cta:hover{transform:translateY(-2px)}
  .cta:active{transform:translateY(0) scale(.97)}
  .cta .icon{font-size:18px;line-height:1;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes glow{
    0%,100%{box-shadow:0 14px 30px -12px rgba(180,90,110,.6)}
    50%{box-shadow:0 14px 34px -10px rgba(180,90,110,.85),
         0 0 0 8px rgba(201,135,147,.1)}
  }
  .cta-hint{
    font-family:'Montserrat',Arial,sans-serif;font-size:10px;
    color:var(--muted);letter-spacing:2px;text-transform:uppercase;
    margin-top:16px;
  }
  .petals{
    position:fixed;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:1;overflow:hidden;
  }
  .petal{
    position:absolute;top:-30px;color:var(--rose2);
    font-size:14px;opacity:.55;animation:fall linear infinite;
  }
  @keyframes fall{
    0%{transform:translateY(-30px) rotate(0);opacity:0}
    10%{opacity:.6}
    90%{opacity:.4}
    100%{transform:translateY(110vh) rotate(360deg);opacity:0}
  }
  .gallery{display:none}
  .gallery.open{display:block;animation:fade .55s ease}
  @keyframes fade{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }
  .gallery-head{text-align:center;padding:24px 4px 18px}
  .gallery-head h2{
    font-weight:300;margin:0 0 8px;font-size:28px;letter-spacing:.5px;
  }
  .gallery-head p{
    margin:0;color:var(--muted);font-family:'Montserrat',Arial,sans-serif;
    font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
  }
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .photo{
    border:0;padding:0;aspect-ratio:1;overflow:hidden;background:#eee;
    cursor:pointer;border-radius:6px;position:relative;
    opacity:0;transform:translateY(20px) scale(.95);
    animation:photoIn .6s ease forwards;
  }
  @keyframes photoIn{to{opacity:1;transform:none}}
  .photo img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .5s cubic-bezier(.2,0,.2,1);
  }
  .photo:active img{transform:scale(.96)}
  @media (hover:hover){.photo:hover img{transform:scale(1.06)}}
  .note{
    text-align:center;margin:24px 0 0;color:var(--muted);
    font:11px/1.8 'Montserrat',Arial,sans-serif;letter-spacing:.5px;
  }
  .viewer{
    position:fixed;inset:0;background:rgba(25,17,19,.97);z-index:50;
    display:none;align-items:center;justify-content:center;touch-action:none;
  }
  .viewer.open{display:flex;animation:vin .3s ease}
  @keyframes vin{from{opacity:0}to{opacity:1}}
  .viewer img{
    max-width:94vw;max-height:82vh;object-fit:contain;
    user-select:none;border-radius:2px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  }
  .close,.nav{
    position:absolute;border:0;color:white;
    background:rgba(255,255,255,.1);backdrop-filter:blur(8px);
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    cursor:pointer;font-family:Arial,sans-serif;font-size:22px;
    transition:background .2s;
  }
  .close:hover,.nav:hover{background:rgba(255,255,255,.22)}
  .close{right:16px;top:16px}
  .prev{left:12px}
  .next{right:12px}
  .counter{
    position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
    color:white;font:12px 'Montserrat',Arial,sans-serif;letter-spacing:2px;
    background:rgba(0,0,0,.35);padding:8px 14px;border-radius:20px;
    backdrop-filter:blur(8px);
  }
  @media (max-width:480px){
    h1{font-size:28px}
    .cd-num{font-size:17px}
    .cd-item{min-width:44px}
    .cta{padding:16px 34px;font-size:13px}
    .cal-btn{padding:11px 22px;font-size:11px}
  }
</style>
</head>
<body>

<div class="petals" id="petals"></div>

<main class="page">
  <section class="hero">
    <div class="eyebrow">Our Wedding Memories</div>
    <div class="ornament"><span>✦</span></div>
    <h1>THAN ZAW HTUT <span class="amp">&amp;</span> EI EI PHYO</h1>
    <div class="date">15 • 11 • 2026</div>
    <div class="countdown">
      <div class="cd-item" id="cdItemD"><div class="cd-num" id="cdD">--</div><div class="cd-lbl">Days</div></div>
      <div class="cd-sep">·</div>
      <div class="cd-item" id="cdItemH"><div class="cd-num" id="cdH">--</div><div class="cd-lbl">Hours</div></div>
      <div class="cd-sep">·</div>
      <div class="cd-item" id="cdItemM"><div class="cd-num" id="cdM">--</div><div class="cd-lbl">Min</div></div>
      <div class="cd-sep">·</div>
      <div class="cd-item" id="cdItemS"><div class="cd-num" id="cdS">--</div><div class="cd-lbl">Sec</div></div>
    </div>
  </section>

  <section class="calendar-wrap">
    <button class="cal-btn" id="calBtn" type="button">
      <span class="cal-icon">📅</span>
      <span>Add to Calendar</span>
    </button>
  </section>

  <section class="cta-wrap">
    <button class="cta" id="openBtn" type="button">
      <span class="icon">❀</span>
      <span>ကြည့်မယ်</span>
    </button>
    <div class="cta-hint">Tap to view our memories</div>
  </section>

  <section id="gallery" class="gallery" aria-live="polite">
    <div class="gallery-head">
      <h2>Our Wedding Memories</h2>
      <p>Than Zaw Htut &amp; Ei Ei Phyo • 15.11.2026</p>
    </div>
    <div id="grid" class="grid"></div>
    <p class="note">Photos from our special day</p>
  </section>
</main>

<div id="viewer" class="viewer" aria-modal="true" role="dialog">
  <button id="close" class="close" type="button" aria-label="Close">×</button>
  <button id="prev" class="nav prev" type="button" aria-label="Previous">‹</button>
  <img id="viewerImg" alt="Wedding memory">
  <button id="next" class="nav next" type="button" aria-label="Next">›</button>
  <div id="counter" class="counter">1 / 30</div>
</div>
<script>
(() => {
  const root = document;
  const gallery = root.getElementById('gallery');
  const grid = root.getElementById('grid');
  const viewer = root.getElementById('viewer');
  const viewerImg = root.getElementById('viewerImg');
  const counter = root.getElementById('counter');
  const openBtn = root.getElementById('openBtn');
  const calBtn = root.getElementById('calBtn');

  const WEDDING = {
    title: "THAN ZAW HTUT & EI EI PHYO — Wedding",
    date: "2026-11-15T09:00:00",
    endDate: "2026-11-15T14:00:00",
    location: "မင်္ဂလာဆောင် ခန်းမ",
    details: "ကျွန်တော်တို့ရဲ့ မင်္ဂလာဆောင်သို့ ကြွရောက်ပေးပါရန် လေးစားစွာ ဖိတ်ခေါ်အပ်ပါသည်။"
  };

  // === PHOTOS_START ===
  const photos = [
    { src: "https://i.postimg.cc/Pvh9xjRq/08c4521ca55e259360993ae9e78fd9ea.webp", alt: "Wedding memory 1" },
    { src: "https://i.postimg.cc/Fd0wNRG2/0bf3a9045f91905717417cf06ca94e1a.webp", alt: "Wedding memory 2" },
    { src: "https://i.postimg.cc/c6SLY8qc/12bfd787ceee037b587da82341e2d9ce.webp", alt: "Wedding memory 3" },
    { src: "https://i.postimg.cc/VrX2m6Dv/29554e79f081defef3e0e88f2508c8bd.webp", alt: "Wedding memory 4" },
    { src: "https://i.postimg.cc/mhy2S2RJ/29c44544171375e8e2ce5b645ffd00fa.webp", alt: "Wedding memory 5" },
    { src: "https://i.postimg.cc/0Kf3K4gs/2b46d76db6e53af89cd80a79ed9e40b4.webp", alt: "Wedding memory 6" },
    { src: "https://i.postimg.cc/DJ1RnZ5D/2cd76d4e21775ed04347ec20a0029e2a.webp", alt: "Wedding memory 7" },
    { src: "https://i.postimg.cc/1VHTVjkC/3466987ac01a8dec342ed5ae7362fe94.webp", alt: "Wedding memory 8" },
    { src: "https://i.postimg.cc/Th63mW8y/350ae58c1f28aa16f2bcf6dd6ffcbf6e.webp", alt: "Wedding memory 9" },
    { src: "https://i.postimg.cc/HcbFdx3R/35e0d65036020545aac73ca01eacebea.webp", alt: "Wedding memory 10" },
    { src: "https://i.postimg.cc/ZB6X4RVZ/36d222d4ca861e79ddb7e6d85b6f5ec0.webp", alt: "Wedding memory 11" },
    { src: "https://i.postimg.cc/62CFt3Y6/3d5ac7ea30a3ac7e12b261394ae3ab79.webp", alt: "Wedding memory 12" },
    { src: "https://i.postimg.cc/8F2x2WBD/448acf3995db8b8072d59e2063e1dc3a.webp", alt: "Wedding memory 13" },
    { src: "https://i.postimg.cc/XXbYFyMH/4cde46afc9e8771a6a9a68f29c6587ab.webp", alt: "Wedding memory 14" },
    { src: "https://i.postimg.cc/yWyYTYsK/5bab9faadf061d31137785a4420ae0e8.webp", alt: "Wedding memory 15" },
    { src: "https://i.postimg.cc/XXk7g746/666bc059965b0ed33b1fc088360cd1d0.webp", alt: "Wedding memory 16" },
    { src: "https://i.postimg.cc/q60SRT5Z/6e0ea46910f8c43ce16d4bec4dc1840d.webp", alt: "Wedding memory 17" },
    { src: "https://i.postimg.cc/0KxFQsB0/7200d82a45e1886fbda85c940545d0f4.webp", alt: "Wedding memory 18" },
    { src: "https://i.postimg.cc/sGyqXrNp/7a097b4ba6cad7aa3eafdd02ffa34fe3.webp", alt: "Wedding memory 19" },
    { src: "https://i.postimg.cc/30B60csZ/818af84074ab66893c293c9bdbfc432b.webp", alt: "Wedding memory 20" },
    { src: "https://i.postimg.cc/WDBxBr6P/8260c3e999a4bce41f3d8165d6bbfd26.webp", alt: "Wedding memory 21" },
    { src: "https://i.postimg.cc/Th63mW8b/836a193db1027b02f0a351101e075066.webp", alt: "Wedding memory 22" },
    { src: "https://i.postimg.cc/sGyqXrNh/9805a7217913ec04d6e3685560656eec.webp", alt: "Wedding memory 23" },
    { src: "https://i.postimg.cc/T59S54z9/aa04f4e122622ece856996f26206d86c.webp", alt: "Wedding memory 24" },
    { src: "https://i.postimg.cc/zLs4sWSr/ae0d6efb5a313cd3ee4ff08e0aa2317b.webp", alt: "Wedding memory 25" },
    { src: "https://i.postimg.cc/s1rgSZFk/b88678f4a848c1cf84f0636fc3e0563c.webp", alt: "Wedding memory 26" },
    { src: "https://i.postimg.cc/sBkbkSP5/c6b063d891901fb501acb39f8fcdb975.webp", alt: "Wedding memory 27" },
    { src: "https://i.postimg.cc/8JLxN5t8/d7d861eba6aeca0e6ef53828f1319c7c.webp", alt: "Wedding memory 28" },
    { src: "https://i.postimg.cc/kDmg8trp/f52bb718b3d4ec15f98f5324e5d58963.webp", alt: "Wedding memory 29" },
    { src: "https://i.postimg.cc/k6WLq4fR/faead7763046de3d5cf2969b55ce2b69.webp", alt: "Wedding memory 30" }
  ];
  // === PHOTOS_END ===

  let current = 0;
  let startX = 0;

  const target = new Date(WEDDING.date);
  const prevVals = { d:null, h:null, m:null, s:null };
  const itemMap = { d:'cdItemD', h:'cdItemH', m:'cdItemM', s:'cdItemS' };
  const numMap  = { d:'cdD', h:'cdH', m:'cdM', s:'cdS' };

  function tick(){
    const d = Math.max(0, target - new Date());
    const vals = {
      d: Math.floor(d / 86400000),
      h: Math.floor(d % 86400000 / 3600000),
      m: Math.floor(d % 3600000 / 60000),
      s: Math.floor(d % 60000 / 1000)
    };
    ['d','h','m','s'].forEach(k => {
      const el = root.getElementById(numMap[k]);
      const val = String(vals[k]).padStart(2,'0');
      if (el.textContent !== val){
        el.textContent = val;
        if (prevVals[k] !== null){
          const item = root.getElementById(itemMap[k]);
          item.classList.remove('tick');
          void item.offsetWidth;
          item.classList.add('tick');
        }
        prevVals[k] = val;
      }
    });
  }
  tick(); setInterval(tick, 1000);

  (function petals(){
    const wrap = root.getElementById('petals');
    const glyphs = ['❀','✿','❁','✾','❃'];
    for (let i = 0; i < 14; i++){
      const p = root.createElement('div');
      p.className = 'petal';
      p.textContent = glyphs[i % glyphs.length];
      p.style.left = Math.random() * 100 + '%';
      p.style.fontSize = (10 + Math.random() * 12) + 'px';
      p.style.animationDuration = (10 + Math.random() * 12) + 's';
      p.style.animationDelay = (Math.random() * 12) + 's';
      wrap.appendChild(p);
    }
  })();

  function toCalDate(iso){
    return iso.replace(/[-:]/g,'').replace(/\.\d+/,'').slice(0,15);
  }

  function googleCalUrl(){
    const p = new URLSearchParams({
      action: 'TEMPLATE',
      text: WEDDING.title,
      dates: `${toCalDate(WEDDING.date)}/${toCalDate(WEDDING.endDate)}`,
      details: WEDDING.details,
      location: WEDDING.location,
      ctz: 'Asia/Yangon'
    });
    return `https://calendar.google.com/calendar/render?${p}`;
  }

  function downloadICS(){
    const uid = 'wedding-' + Date.now() + '@weedingphoto.github.io';
    const dtstamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'').slice(0,15) + 'Z';
    const escape = s => String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
    const ics = [
      'BEGIN:VCALENDAR','VERSION:2.0',
      'PRODID:-//Wedding//Invitation//EN','CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      `UID:${uid}`,
      `DTSTAMP:${dtstamp}`,
      `DTSTART;TZID=Asia/Yangon:${toCalDate(WEDDING.date)}`,
      `DTEND;TZID=Asia/Yangon:${toCalDate(WEDDING.endDate)}`,
      `SUMMARY:${escape(WEDDING.title)}`,
      `DESCRIPTION:${escape(WEDDING.details)}`,
      `LOCATION:${escape(WEDDING.location)}`,
      'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY',
      'DESCRIPTION:Wedding Tomorrow!','END:VALARM',
      'END:VEVENT','END:VCALENDAR'
    ].join('\r\n');
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'wedding-invitation.ics';
    a.click();
    URL.revokeObjectURL(url);
  }

  calBtn.addEventListener('click', () => {
    if (/iPad|iPhone|iPod/.test(navigator.userAgent)){
      downloadICS();
    } else {
      window.open(googleCalUrl(), '_blank');
    }
  });

  function openGallery(){
    gallery.classList.add('open');
    setTimeout(() => gallery.scrollIntoView({behavior:'smooth', block:'start'}), 60);
  }

  function renderGallery(){
    grid.innerHTML = photos.map((p,i) => `
      <button class="photo" type="button" data-index="${i}" aria-label="Open photo ${i+1}"
              style="animation-delay:${i * 0.04}s">
        <img loading="lazy" src="${p.src}" alt="${p.alt}">
      </button>
    `).join('');
  }

  function openViewer(index){
    current = (index + photos.length) % photos.length;
    viewerImg.src = photos[current].src;
    viewerImg.alt = photos[current].alt;
    counter.textContent = `${current+1} / ${photos.length}`;
    viewer.classList.add('open');
  }

  function closeViewer(){ viewer.classList.remove('open'); }
  function move(step){ openViewer(current + step); }

  openBtn.addEventListener('click', openGallery);

  grid.addEventListener('click', e => {
    const btn = e.target.closest('.photo');
    if(btn) openViewer(Number(btn.dataset.index));
  });

  root.getElementById('close').addEventListener('click', closeViewer);
  root.getElementById('prev').addEventListener('click', () => move(-1));
  root.getElementById('next').addEventListener('click', () => move(1));

  viewer.addEventListener('click', e => { if(e.target === viewer) closeViewer(); });

  viewer.addEventListener('touchstart', e => {
    startX = e.changedTouches[0].clientX;
  }, {passive:true});
  viewer.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    if(Math.abs(dx) > 55) move(dx < 0 ? 1 : -1);
  }, {passive:true});

  root.addEventListener('keydown', e => {
    if(!viewer.classList.contains('open')) return;
    if(e.key === 'Escape') closeViewer();
    if(e.key === 'ArrowLeft') move(-1);
    if(e.key === 'ArrowRight') move(1);
  });

  renderGallery();
})();
</script>
</body>
</html>
